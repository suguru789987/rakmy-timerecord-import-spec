<svg xmlns="http://www.w3.org/2000/svg" width="948" height="954" viewBox="0 0 948 954" font-family='"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif'>
<rect width="948" height="954" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9db1bd"/></marker></defs>
<text x="150" y="54" font-size="26" font-weight="700" fill="#1b2a33">CSVで取り込むときの5つの手順</text>
<text x="150" y="86" font-size="15.5" fill="#6b7a83">導入時も運用中も、この流れは同じです</text>
<rect x="150" y="124" width="600" height="126" rx="12" fill="#eef4f8" stroke="#b9cdd9" stroke-width="1.5"/>
<rect x="150" y="124" width="14" height="126" rx="7" fill="#2f4858"/><rect x="157" y="124" width="7" height="126" fill="#2f4858"/>
<text x="132" y="176" font-size="17" font-weight="700" fill="#2f4858" text-anchor="end">手順1</text>
<text x="132" y="200" font-size="13.5" fill="#8a99a3" text-anchor="end">ヘルプ 6番</text>
<text x="186" y="180" font-size="20" font-weight="700" fill="#1b2a33">テンプレートをダウンロード</text>
<text x="186" y="210" font-size="15" fill="#5c6b74">種類ごとの入力用ファイルを入手します</text>
<path d="M450.0 258 L450.0 278" stroke="#9db1bd" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="150" y="290" width="600" height="126" rx="12" fill="#eef4f8" stroke="#b9cdd9" stroke-width="1.5"/>
<rect x="150" y="290" width="14" height="126" rx="7" fill="#2f4858"/><rect x="157" y="290" width="7" height="126" fill="#2f4858"/>
<text x="132" y="342" font-size="17" font-weight="700" fill="#2f4858" text-anchor="end">手順2</text>
<text x="132" y="366" font-size="13.5" fill="#8a99a3" text-anchor="end">ヘルプ 7番</text>
<text x="186" y="346" font-size="20" font-weight="700" fill="#1b2a33">CSVに入力してアップロード</text>
<text x="186" y="376" font-size="15" fill="#5c6b74">Excelで入力し、ファイルを投入します</text>
<path d="M450.0 424 L450.0 444" stroke="#9db1bd" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="150" y="456" width="600" height="126" rx="12" fill="#eef4f8" stroke="#b9cdd9" stroke-width="1.5"/>
<rect x="150" y="456" width="14" height="126" rx="7" fill="#2f4858"/><rect x="157" y="456" width="7" height="126" fill="#2f4858"/>
<text x="132" y="508" font-size="17" font-weight="700" fill="#2f4858" text-anchor="end">手順3</text>
<text x="132" y="532" font-size="13.5" fill="#8a99a3" text-anchor="end">ヘルプ 8番</text>
<text x="186" y="506" font-size="20" font-weight="700" fill="#1b2a33">内容を確認</text>
<text x="186" y="536" font-size="15" fill="#5c6b74">登録される内容とエラーが表示されます</text>
<text x="186" y="559" font-size="15" fill="#5c6b74">この時点ではまだ登録されていません</text>
<path d="M450.0 590 L450.0 610" stroke="#9db1bd" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="150" y="622" width="600" height="126" rx="12" fill="#f7f8f9" stroke="#d8dee2" stroke-width="1.5"/>
<rect x="150" y="622" width="14" height="126" rx="7" fill="#2f4858"/><rect x="157" y="622" width="7" height="126" fill="#2f4858"/>
<text x="132" y="674" font-size="17" font-weight="700" fill="#2f4858" text-anchor="end">手順4</text>
<text x="132" y="698" font-size="13.5" fill="#8a99a3" text-anchor="end">ヘルプ 9番</text>
<text x="186" y="678" font-size="20" font-weight="700" fill="#1b2a33">取り込みを実行</text>
<text x="186" y="708" font-size="15" fill="#5c6b74">進み具合が表示されます</text>
<path d="M450.0 756 L450.0 776" stroke="#9db1bd" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="150" y="788" width="600" height="126" rx="12" fill="#f7f8f9" stroke="#d8dee2" stroke-width="1.5"/>
<rect x="150" y="788" width="14" height="126" rx="7" fill="#2f4858"/><rect x="157" y="788" width="7" height="126" fill="#2f4858"/>
<text x="132" y="840" font-size="17" font-weight="700" fill="#2f4858" text-anchor="end">手順5</text>
<text x="132" y="864" font-size="13.5" fill="#8a99a3" text-anchor="end">ヘルプ 10番</text>
<text x="186" y="844" font-size="20" font-weight="700" fill="#1b2a33">完了画面で確認</text>
<text x="186" y="874" font-size="15" fill="#5c6b74">結果を確認し、招待メールを送ります</text>
<path d="M766 124 L780 124 L780 582 L766 582" fill="none" stroke="#4a90a4" stroke-width="2.5"/>
<text x="792" y="347.0" font-size="16" font-weight="700" fill="#2f6d80">ここまでは</text>
<text x="792" y="371.0" font-size="16" font-weight="700" fill="#2f6d80">やり直せます</text>
<path d="M766 622 L780 622 L780 914 L766 914" fill="none" stroke="#c2ccd2" stroke-width="2.5"/>
<text x="792" y="752.0" font-size="16" fill="#7b8a93">登録されます</text>
<text x="792" y="776.0" font-size="16" fill="#7b8a93">修正は画面から</text>
<text x="792" y="798.0" font-size="13.5" fill="#9aa7ae">（ヘルプ 4番）</text>
</svg>